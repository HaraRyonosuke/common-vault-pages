<h1>common-vault</h1>
<p>common-vault は、開発者本人が個人で使うためのアプリです。本人の Google ドライブにあるメモを、本人が使う AI アシスタントから読み書きできるようにします。</p>
<p>一般には公開していません。使えるのは開発者本人の Google アカウントだけです。</p>
<h2>できること</h2>
<ul>
  <li>このアプリが作ったファイルと、本人が選んだファイルだけを読み書きします。</li>
  <li>ドライブのほかのファイルには触れません。</li>
</ul>
